# Local-dev Prometheus config for the VoteChain backend. (#66)
# Started via `docker-compose up prometheus grafana backend redis`.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "votechain-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3001"]
        labels:
          service: "votechain-backend"
