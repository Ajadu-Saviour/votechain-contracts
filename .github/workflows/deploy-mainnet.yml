name: Deploy to Mainnet

# ── Trigger ────────────────────────────────────────────────────────────────────
# This workflow runs only on version tags (e.g., v1.2.3).
# It does NOT rebuild contracts; it reuses the WASM artifact produced by the
# CI "Build WASM" job for the same commit.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: deploy-mainnet
  cancel-in-progress: false   # never cancel a running mainnet deploy

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: "22.8.2"

# ── Permissions ────────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to commit config/mainnet.toml and create the release
  actions: read

jobs:
  # ── 1. Verify CI passed on this exact commit ─────────────────────────────────
  verify-ci:
    name: Verify CI Green
    runs-on: ubuntu-latest
    steps:
      - name: Check CI status for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Checking CI status for $SHA..."

          # Wait up to 10 minutes for any in-progress CI runs to complete.
          for i in $(seq 1 20); do
            STATUS=$(gh api \
              "repos/${{ github.repository }}/commits/$SHA/check-suites" \
              --jq '[.check_suites[] | select(.app.slug == "github-actions")] | map(.status) | unique | .[]' 2>/dev/null || echo "unknown")

            CONCLUSION=$(gh api \
              "repos/${{ github.repository }}/commits/$SHA/check-suites" \
              --jq '[.check_suites[] | select(.app.slug == "github-actions")] | map(.conclusion) | map(select(. != null)) | unique | .[]' 2>/dev/null || echo "unknown")

            echo "Attempt $i — status=$STATUS conclusion=$CONCLUSION"

            if echo "$STATUS" | grep -q "in_progress\|queued"; then
              echo "CI still running, waiting 30s..."
              sleep 30
              continue
            fi

            if echo "$CONCLUSION" | grep -qv "success"; then
              echo "❌ CI did not pass on $SHA (conclusion: $CONCLUSION). Aborting mainnet deploy."
              exit 1
            fi

            echo "✅ CI passed on $SHA"
            break
          done

  # ── 2. Download the WASM artifact built by CI ─────────────────────────────────
  # We do NOT rebuild. The artifact is the exact binary that was tested.
  download-wasm:
    name: Download CI WASM Artifact
    runs-on: ubuntu-latest
    needs: verify-ci
    outputs:
      artifact-name: ${{ steps.find.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v4

      - name: Find WASM artifact for this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"

          # List artifacts from recent runs on this SHA
          ARTIFACT=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts" \
            --jq ".artifacts[] | select(.name | startswith(\"wasm-contracts\")) | select(.workflow_run.head_sha == \"$SHA\") | .name" \
            | head -1)

          if [[ -z "$ARTIFACT" ]]; then
            echo "❌ No wasm-contracts artifact found for $SHA. Run CI first."
            exit 1
          fi

          echo "Found artifact: $ARTIFACT"
          echo "artifact-name=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Download WASM artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = '${{ steps.find.outputs.artifact-name }}';
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: artifactName,
            });

            if (!artifacts.data.artifacts.length) {
              core.setFailed(`Artifact ${artifactName} not found`);
              return;
            }

            const artifact = artifacts.data.artifacts[0];
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });

            const fs = require('fs');
            fs.writeFileSync('wasm-contracts.zip', Buffer.from(download.data));

      - name: Unzip and verify WASM files
        run: |
          unzip -o wasm-contracts.zip -d wasm/
          echo "WASM files:"
          ls -lh wasm/*.wasm

          # Verify both contracts are present
          [[ -f wasm/votechain_governance.wasm ]] || { echo "❌ governance WASM missing"; exit 1; }
          [[ -f wasm/votechain_token.wasm ]]      || { echo "❌ token WASM missing"; exit 1; }

          # Record hashes for the release notes
          sha256sum wasm/*.wasm | tee wasm-hashes.txt

      - name: Upload WASM to job artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-wasm-${{ github.ref_name }}
          path: |
            wasm/*.wasm
            wasm-hashes.txt
          retention-days: 90
          if-no-files-found: error

  # ── 3. Deploy to staging and smoke-test ──────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: download-wasm
    environment:
      name: staging
      url: https://testnet.stellar.expert
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Stellar CLI binary
        id: stellar-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-stellar-cli-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }}

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: mainnet-wasm-${{ github.ref_name }}
          path: wasm/

      - name: Deploy to staging
        id: staging-deploy
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          STELLAR_ADMIN_ADDRESS: ${{ secrets.STAGING_ADMIN_ADDRESS }}
        run: |
          set -euo pipefail

          export SOROBAN_RPC_URL="https://soroban-testnet.stellar.org"
          export SOROBAN_NETWORK_PASSPHRASE="Test SDF Network ; September 2015"

          echo "🚀 Deploying to staging (testnet)..."

          TOKEN_ID=$(stellar contract deploy \
            --wasm wasm/votechain_token.wasm \
            --source "$STELLAR_SECRET_KEY" \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$SOROBAN_NETWORK_PASSPHRASE" \
            2>&1 | tail -1)

          GOVERNANCE_ID=$(stellar contract deploy \
            --wasm wasm/votechain_governance.wasm \
            --source "$STELLAR_SECRET_KEY" \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$SOROBAN_NETWORK_PASSPHRASE" \
            2>&1 | tail -1)

          echo "token-id=$TOKEN_ID"       >> "$GITHUB_OUTPUT"
          echo "governance-id=$GOVERNANCE_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Staging deploy complete — token=$TOKEN_ID governance=$GOVERNANCE_ID"

      - name: Smoke test staging contracts
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
        run: |
          set -euo pipefail
          TOKEN_ID="${{ steps.staging-deploy.outputs.token-id }}"
          GOVERNANCE_ID="${{ steps.staging-deploy.outputs.governance-id }}"

          export SOROBAN_RPC_URL="https://soroban-testnet.stellar.org"
          export SOROBAN_NETWORK_PASSPHRASE="Test SDF Network ; September 2015"

          echo "🔍 Smoke-testing deployed contracts..."

          # Verify token contract responds
          stellar contract invoke \
            --id "$TOKEN_ID" \
            --source "$STELLAR_SECRET_KEY" \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$SOROBAN_NETWORK_PASSPHRASE" \
            -- total_supply && echo "✅ Token contract smoke test passed"

          echo "✅ Staging smoke tests passed"

  # ── 4. Manual approval gate — blocks until a reviewer approves ───────────────
  await-approval:
    name: Await Mainnet Approval
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: mainnet   # <-- GitHub Environment with required reviewers configured
    steps:
      - name: Approval granted
        run: |
          echo "✅ Mainnet deployment approved by: ${{ github.actor }}"
          echo "Tag: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  # ── 5. Deploy to mainnet ──────────────────────────────────────────────────────
  deploy-mainnet:
    name: Deploy to Mainnet
    runs-on: ubuntu-latest
    needs: await-approval
    environment:
      name: mainnet
      url: https://stellar.expert
    outputs:
      token-id: ${{ steps.deploy.outputs.token-id }}
      governance-id: ${{ steps.deploy.outputs.governance-id }}
      wasm-hash-governance: ${{ steps.hashes.outputs.governance }}
      wasm-hash-token: ${{ steps.hashes.outputs.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Stellar CLI binary
        id: stellar-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-stellar-cli-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }}

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: mainnet-wasm-${{ github.ref_name }}
          path: wasm/

      - name: Record WASM hashes
        id: hashes
        run: |
          GOV_HASH=$(sha256sum wasm/votechain_governance.wasm | awk '{print $1}')
          TOK_HASH=$(sha256sum wasm/votechain_token.wasm      | awk '{print $1}')
          echo "governance=$GOV_HASH" >> "$GITHUB_OUTPUT"
          echo "token=$TOK_HASH"      >> "$GITHUB_OUTPUT"
          echo "WASM SHA-256 hashes:"
          echo "  governance: $GOV_HASH"
          echo "  token:      $TOK_HASH"

      - name: Deploy contracts to mainnet
        id: deploy
        env:
          STELLAR_SECRET_KEY: ${{ secrets.MAINNET_SECRET_KEY }}
          STELLAR_ADMIN_ADDRESS: ${{ secrets.MAINNET_ADMIN_ADDRESS }}
        run: |
          set -euo pipefail

          export SOROBAN_RPC_URL="https://horizon.stellar.org"
          export SOROBAN_NETWORK_PASSPHRASE="Public Global Stellar Network ; September 2015"

          echo "🚀 Deploying token contract to mainnet..."
          TOKEN_ID=$(stellar contract deploy \
            --wasm wasm/votechain_token.wasm \
            --source "$STELLAR_SECRET_KEY" \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$SOROBAN_NETWORK_PASSPHRASE" \
            2>&1 | tail -1)
          echo "✅ Token deployed: $TOKEN_ID"

          echo "🚀 Deploying governance contract to mainnet..."
          GOVERNANCE_ID=$(stellar contract deploy \
            --wasm wasm/votechain_governance.wasm \
            --source "$STELLAR_SECRET_KEY" \
            --rpc-url "$SOROBAN_RPC_URL" \
            --network-passphrase "$SOROBAN_NETWORK_PASSPHRASE" \
            2>&1 | tail -1)
          echo "✅ Governance deployed: $GOVERNANCE_ID"

          echo "token-id=$TOKEN_ID"           >> "$GITHUB_OUTPUT"
          echo "governance-id=$GOVERNANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Update config/mainnet.toml with deployed contract addresses
        id: update-config
        env:
          TOKEN_ID: ${{ steps.deploy.outputs.token-id }}
          GOVERNANCE_ID: ${{ steps.deploy.outputs.governance-id }}
        run: |
          set -euo pipefail
          cat > config/mainnet.toml << TOML_EOF
          # VoteChain Mainnet Configuration
          # Auto-updated by deploy-mainnet.yml on $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          # Version: ${{ github.ref_name }} — commit ${{ github.sha }}

          rpc_url = "https://horizon.stellar.org"
          network_passphrase = "Public Global Stellar Network ; September 2015"

          [contracts]
          token_contract_id = "$TOKEN_ID"
          governance_contract_id = "$GOVERNANCE_ID"
          TOML_EOF

          echo "Updated config/mainnet.toml:"
          cat config/mainnet.toml

      - name: Commit updated config/mainnet.toml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add config/mainnet.toml
          git commit -m "chore: update mainnet contract addresses for ${{ github.ref_name }} [skip ci]" \
            || echo "No changes to config/mainnet.toml"

          # Push the commit back to the tag's base branch (main).
          # Determine the branch from the tag's commit.
          BASE_BRANCH=$(git branch -r --contains "${{ github.sha }}" \
            | grep -v HEAD | head -1 | sed 's|origin/||;s/ //')
          echo "Pushing config update to $BASE_BRANCH"
          git push origin "HEAD:refs/heads/${BASE_BRANCH:-main}"

  # ── 6. Create GitHub Release with deployment summary ─────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-mainnet
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifact for release attachment
        uses: actions/download-artifact@v4
        with:
          name: mainnet-wasm-${{ github.ref_name }}
          path: wasm/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN_ID: ${{ needs.deploy-mainnet.outputs.token-id }}
          GOVERNANCE_ID: ${{ needs.deploy-mainnet.outputs.governance-id }}
          HASH_GOV: ${{ needs.deploy-mainnet.outputs.wasm-hash-governance }}
          HASH_TOK: ${{ needs.deploy-mainnet.outputs.wasm-hash-token }}
        run: |
          TAG="${{ github.ref_name }}"
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          gh release create "$TAG" \
            wasm/votechain_governance.wasm \
            wasm/votechain_token.wasm \
            wasm/wasm-hashes.txt \
            --title "VoteChain $TAG" \
            --notes "## VoteChain $TAG — Mainnet Deployment

          **Deployed:** $TIMESTAMP
          **Commit:** \`${{ github.sha }}\`

          ---

          ### Contract Addresses (Mainnet)

          | Contract | Address |
          |----------|---------|
          | Token | \`$TOKEN_ID\` |
          | Governance | \`$GOVERNANCE_ID\` |

          Contract addresses have been committed to \`config/mainnet.toml\`.

          ---

          ### WASM SHA-256 Hashes

          | Binary | SHA-256 |
          |--------|---------|
          | \`votechain_governance.wasm\` | \`$HASH_GOV\` |
          | \`votechain_token.wasm\` | \`$HASH_TOK\` |

          These hashes match the artifacts built and tested in CI (no re-build occurred).
          Verify with:
          \`\`\`bash
          sha256sum votechain_governance.wasm
          sha256sum votechain_token.wasm
          \`\`\`

          ---

          ### Deployment Steps Completed

          1. ✅ CI verified green on this commit
          2. ✅ Staging (testnet) deploy and smoke tests passed
          3. ✅ Manual approval gate passed
          4. ✅ Mainnet deploy successful
          5. ✅ \`config/mainnet.toml\` updated and committed
          6. ✅ GitHub Release created (this release)

          See [docs/mainnet-runbook.md](docs/mainnet-runbook.md) for the full runbook."
