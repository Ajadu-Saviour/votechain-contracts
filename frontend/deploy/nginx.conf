# Nginx config for serving the VoteChain frontend with a strict CSP (#94).
# Replace API_URL with the deployed backend origin (e.g. https://api.votechain.example).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    set $csp_connect "'self' API_URL https://horizon-testnet.stellar.org https://soroban-testnet.stellar.org";

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src $csp_connect; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; report-uri /csp-report; report-to csp-endpoint" always;
    add_header Reporting-Endpoints 'csp-endpoint="/csp-report"' always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # CSP violation reports are forwarded to the backend for logging.
    location = /csp-report {
        proxy_pass http://backend:3000/csp-report;
        proxy_set_header Content-Type $content_type;
        client_max_body_size 16k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
